name: Run

on: [push, pull_request]

jobs:
  run:
    name: Run the analysis on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the project
        run: python miniproject2.py
      - name: Check that the graphs were produced
        run: test -f graphs/difference_between_standpunkt_and_exam.png && test -f graphs/distribution_of_grade_differences.png
